spring.application.name=product-gestion
server.port=8080

# ═══════════════════════════════════════
# JPA / HIBERNATE - DEV
# ═══════════════════════════════════════
spring.datasource.url=jdbc:postgresql://localhost:5432/product_gestion_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ═══════════════════════════════════════
# JACKSON
# ═══════════════════════════════════════
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Africa/Douala

# ═══════════════════════════════════════
# SECURITY
# ═══════════════════════════════════════
app.jwt.secret=${JWT_SECRET:b68a6fc437a5dccef1f787e79243fd643bb4bbaf876b492e7bc103d89d496bcc=}
app.jwt.expiration=${JWT_EXPIRATION:360000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

app.admin.pseudo=${ADMIN_PSEUDO:admin}
app.admin.password=${ADMIN_PASSWORD:root@123!}
app.admin.email=${ADMIN_EMAIL:root@gmail.com}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}


